<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Run studio</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#111a2c;--raised:#19253d;--line:#293853;--text:#e8edf7;--muted:#a3b0c8;--blue:#8db7ff;--green:#80deb1;--amber:#f4c773;--red:#ffa0ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 ui-sans-serif,system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}button,select,input{font:inherit;color:inherit}button,select,input[type=search]{border:1px solid var(--line);background:var(--raised);border-radius:7px;padding:7px 10px;min-width:0}button{cursor:pointer}button:hover{border-color:var(--blue)}button:disabled{opacity:.4;cursor:default}button.active,button[aria-selected=true]{background:#29416b;border-color:var(--blue)}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}h1,h2,h3,p{margin-top:0}h1{font-size:17px;letter-spacing:-.03em;margin:0}h2{font-size:19px;margin-bottom:4px}h3{font-size:12px;margin-bottom:10px}.muted,small{color:var(--muted)}header{padding:12px 18px;display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--line);background:linear-gradient(110deg,#17253e,#111a2c)}header .brand{white-space:nowrap}#runs{max-width:340px;flex:1}#connection{margin-left:auto;font-size:12px}.controls{display:flex;gap:8px;align-items:center;padding:9px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.controls label{font-size:12px;color:var(--muted)}#position{flex:1;min-width:100px;accent-color:var(--blue)}#progress{font-variant-numeric:tabular-nums;min-width:110px;font-size:12px;color:var(--muted)}#notice{display:none;padding:8px 18px;background:#382630;color:var(--red)}.shell{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(290px,.9fr) minmax(380px,1.3fr);gap:1px;background:var(--line)}aside,section{min-height:0;min-width:0;background:var(--panel)}.side{display:flex;flex-direction:column;padding:14px;gap:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:8px}.stat b{font-size:21px;display:block;font-variant-numeric:tabular-nums}.stat small{font-size:11px}.side h3{margin:0;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}#episodes{overflow:auto;min-height:0}.episode{display:block;width:100%;text-align:left;background:transparent;border-color:transparent;margin-bottom:5px;padding:10px}.episode strong,.episode small{display:block;overflow-wrap:anywhere}.episode.active{box-shadow:inset 3px 0 var(--blue)}.ok{color:var(--green)}.no{color:var(--red)}.pending{color:var(--amber)}.timeline{padding:18px;overflow:auto;scrollbar-gutter:stable}.brief{color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.event{border:1px solid var(--line);border-left:3px solid var(--line);padding:11px 12px;margin:10px 0;border-radius:7px;overflow-wrap:anywhere}.event.submission{border-left-color:var(--blue);cursor:pointer}.event.review{border-left-color:var(--amber)}.event.memory_update{border-left-color:#b29bff;cursor:pointer}.event.task_end{border-left-color:var(--green)}.event.selected{background:var(--raised);border-color:var(--blue)}.event p{margin:7px 0 0;white-space:pre-wrap}.event small{font-variant-numeric:tabular-nums}.event .event-head{display:flex;justify-content:space-between;gap:8px}.detail{display:flex;flex-direction:column;padding:16px;gap:10px;background:#0e1728}.detail h3{margin:0}.inspector-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inspector-controls[hidden]{display:none}.inspector-controls label{font-size:11px;color:var(--muted)}.inspector-controls select{max-width:100%;flex:1}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{padding:6px 9px;font-size:12px}#content{overflow:auto;min-height:0;flex:1;scrollbar-gutter:stable}pre{margin:0;background:#090f1c;border:1px solid var(--line);border-radius:8px;padding:13px;font:12px/1.65 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.diff-line{display:block;min-height:1.65em;white-space:pre-wrap;overflow-wrap:anywhere}.add{color:#a3ebc5;background:#123025}.del{color:#ffb2bd;background:#341e29}.diff-meta{margin-bottom:8px;font-size:12px;color:var(--muted)}.profile-card{padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--raised);overflow-wrap:anywhere}.profile-card h4{margin:0 0 8px;font-size:13px;color:var(--blue)}.profile-card p{margin:5px 0;white-space:pre-wrap}.profile-card ul{padding-left:19px;margin:6px 0}.profile-card .profile-card{background:var(--panel);margin:7px 0}.confidence{display:inline-flex;align-items:center;gap:7px;color:var(--green)}meter{width:80px}.empty{color:var(--muted);padding:28px 12px;max-width:500px}.empty strong{display:block;color:var(--text);margin-bottom:8px}.preview{width:100%;height:420px;min-height:300px;border:1px solid var(--line);border-radius:8px;background:white}.caption{font-size:12px;color:var(--muted);margin:0}details>summary{cursor:pointer;color:var(--muted);margin-bottom:8px}
@media(max-width:1100px){.shell{grid-template-columns:195px minmax(240px,.85fr) minmax(300px,1fr)}header{gap:9px}.detail,.timeline{padding:12px}.side{padding:10px}}
@media(max-width:800px){body{height:auto;min-height:100dvh;overflow:auto}header{flex-wrap:wrap}#connection{margin-left:0}.shell{display:grid;grid-template-columns:170px minmax(0,1fr);flex:none}.side{grid-row:1/3;max-height:calc(100dvh - 120px);position:sticky;top:0}.timeline{height:42dvh}.detail{grid-column:2;height:65dvh;min-height:400px}.controls{padding:8px}.brand small{display:none}}
@media(max-width:520px){.shell{display:flex;flex-direction:column}.side{position:static;max-height:280px}.stats{grid-template-columns:repeat(4,1fr)}.stat b{font-size:18px}#episodes{max-height:130px}.timeline{height:45dvh}.detail{height:70dvh}header{padding:10px}#progress{min-width:90px}}
</style></head><body>
<header><div class="brand"><h1>Run studio</h1><small>Watch, inspect, compare</small></div><select id="runs" aria-label="Run"><option>Loading runs…</option></select><span id="connection" role="status">Connecting…</span></header>
<div class="controls"><button id="live" title="Show all current events and follow new activity">● Live</button><button id="replay" title="Replay from the beginning">↺ Replay</button><button id="play" aria-label="Play replay">▶ Play</button><button id="step" title="Advance one event">Step →</button><label for="speed">Speed</label><select id="speed"><option value="1200">Slow</option><option value="600" selected>Normal</option><option value="200">Fast</option></select><input id="position" aria-label="Replay position" type="range" min="0" max="0" value="0"><span id="progress">0 / 0 events</span></div>
<div id="notice" role="alert"></div>
<main class="shell"><aside class="side"><div class="stats"><div class="stat"><b id="tasks">0</b><small>episodes</small></div><div class="stat"><b id="approved">0</b><small>approved</small></div><div class="stat"><b id="submissions">0</b><small>submissions</small></div><div class="stat"><b id="feedback">0</b><small>reviews</small></div></div><h3>Episodes</h3><input id="filter" type="search" placeholder="Filter user or task…" aria-label="Filter episodes"><div id="episodes"></div></aside><section class="timeline" id="timeline" aria-label="Episode timeline"></section><section class="detail" id="detail" aria-label="Iteration inspector"></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const state={events:[],cursor:0,run:'',selected:null,event:null,tab:'output',base:'previous',file:'',live:true,follow:true,playing:false,complete:false};
let timer=null,loading=false,requestGeneration=0,lastPayload='',runNames=null;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=value=>String(value??'').replaceAll('_',' ');
const empty=(title,body='')=>`<div class="empty"><strong>${esc(title)}</strong>${esc(body)}</div>`;
const visible=()=>state.events.slice(0,state.cursor);
const elapsed=e=>Number.isFinite(Number(e?.elapsed_seconds))?`+${Number(e.elapsed_seconds).toFixed(1)}s`:'—';
function notice(message=''){$('notice').textContent=message;$('notice').style.display=message?'block':'none'}
async function getJSON(url){const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error(`Request failed (${response.status})`);return response.json()}
async function refreshRuns(){try{const names=await getJSON('/api/runs');if(JSON.stringify(names)!==JSON.stringify(runNames)){runNames=names;$('runs').innerHTML=names.length?names.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join(''):'<option value="">No runs yet</option>';$('runs').value=state.run&&names.includes(state.run)?state.run:(names.at(-1)||'')}
if(!state.run&&names.length)await chooseRun();else if(!names.length){$('connection').textContent='No runs yet';render()}}catch(error){notice(`Cannot list runs: ${error.message}. Retrying automatically.`)}}
async function chooseRun(){stop();requestGeneration++;loading=false;state.run=$('runs').value;Object.assign(state,{events:[],cursor:0,selected:null,event:null,base:'previous',file:'',live:true,follow:true,complete:false});lastPayload='';render();await refresh()}
async function refresh(){if(!state.run||loading)return;loading=true;const generation=requestGeneration;try{const data=await getJSON('/api/run/'+encodeURIComponent(state.run));if(generation!==requestGeneration)return;const payload=JSON.stringify(data);state.complete=!!data.complete;if(payload!==lastPayload){lastPayload=payload;state.events=data.events.map((event,index)=>({...event,_index:index}));state.cursor=state.live?state.events.length:Math.min(state.cursor,state.events.length);render()}$('connection').textContent=state.complete?'Run complete · connected':'Connected · polling every 2s';notice()}catch(error){if(generation===requestGeneration){$('connection').textContent='Reconnecting…';notice(`Could not refresh this run: ${error.message}. Your view is preserved; retrying automatically.`)}}finally{if(generation===requestGeneration)loading=false}}
function episodes(shown){const groups=new Map();for(const event of shown){if(event.kind==='task_start')groups.set(event.episode,{start:event,events:[]});if(groups.has(event.episode))groups.get(event.episode).events.push(event)}return [...groups.values()]}
function render(){const shown=visible(),groups=episodes(shown);if(!groups.some(group=>group.start.episode===state.selected)||(state.live&&state.follow&&groups.at(-1)?.start.episode!==state.selected)){state.selected=groups.at(-1)?.start.episode??null;state.event=null;state.base='previous';state.file=''}
$('tasks').textContent=groups.length;$('approved').textContent=shown.filter(e=>e.kind==='task_end'&&e.status==='approved').length;$('submissions').textContent=shown.filter(e=>e.kind==='submission').length;$('feedback').textContent=shown.filter(e=>e.kind==='review').length;
$('position').max=state.events.length;$('position').value=state.cursor;$('progress').textContent=`${state.cursor} / ${state.events.length} events`;$('live').classList.toggle('active',state.live);$('live').textContent=state.complete?'● Latest':'● Live';$('play').textContent=state.playing?'Ⅱ Pause':'▶ Play';$('play').setAttribute('aria-label',state.playing?'Pause replay':'Play replay');$('step').disabled=state.cursor>=state.events.length;$('replay').disabled=!state.events.length;$('play').disabled=!state.events.length;
const query=$('filter').value.toLowerCase(),filtered=groups.filter(group=>`${group.start.user_id} ${group.start.task?.id} ${group.start.split}`.toLowerCase().includes(query));
const sideScroll=$('episodes').scrollTop;$('episodes').innerHTML=filtered.map(group=>{const start=group.start,end=group.events.find(e=>e.kind==='task_end');return `<button class="episode ${state.selected===start.episode?'active':''}" data-episode="${esc(start.episode)}" aria-pressed="${state.selected===start.episode}"><strong>${esc(start.task?.id||'Episode '+start.episode)}</strong><small>${esc(start.user_id)} · ${esc(start.split||'train')}</small><small class="${end?.status==='approved'?'ok':end?'no':'pending'}">${esc(words(end?.status||'in progress'))} · ${group.events.filter(e=>e.kind==='submission').length} versions</small></button>`}).join('')||empty(query?'No matching episodes':'No visible episodes',state.events.length?'Advance playback to reveal events.':'Waiting for the first task.');$('episodes').scrollTop=sideScroll;
renderTimeline(groups.find(group=>group.start.episode===state.selected));renderDetail();}
function renderTimeline(group){const panel=$('timeline'),scroll=panel.scrollTop,atBottom=panel.scrollHeight-panel.clientHeight-scroll<40;if(!group){panel.innerHTML=empty('Follow the run as it unfolds','Select an episode to see worker submissions, user feedback, and profile changes.');return}
panel.innerHTML=`<h2>${esc(group.start.task?.id||'Episode '+group.start.episode)}</h2><p class="caption">${esc(group.start.user_id)} · ${esc(group.start.split)} · episode ${esc(group.start.episode)}</p><details open><summary>Task brief</summary><p class="brief">${esc(group.start.task?.brief||'No brief recorded.')}</p></details>`+group.events.map(event=>`<article class="event ${esc(event.kind)} ${state.event===event._index?'selected':''}" ${['submission','memory_update'].includes(event.kind)?`tabindex="0" role="button" data-event="${event._index}" aria-label="Inspect ${esc(words(event.kind))}"`:''}><div class="event-head"><b>${label(event)}</b><small>${elapsed(event)}</small></div>${body(event)}</article>`).join('');panel.scrollTop=state.live&&atBottom?panel.scrollHeight:scroll;}
function label(e){if(e.kind==='submission')return `Worker · version ${esc(e.version)}`;if(e.kind==='review')return `User review · v${esc(e.version)} <span class="${e.user_review?.approved?'ok':'pending'}">${e.user_review?.approved?'Approved':'Changes requested'}</span>`;if(e.kind==='task_end')return `Finished · ${esc(words(e.status))}`;if(e.kind==='memory_update')return 'Learned profile updated';if(e.kind==='question')return 'Worker asked the user';if(e.kind==='episode_error')return 'Episode error';return 'Task started'}
function body(e){if(e.kind==='review')return `<p>${esc(e.user_review?.feedback||'No written feedback.')}</p>`;if(e.kind==='submission'){const files=e.artifact_files||[];return `<p class="caption">${files.length} file(s) · <span class="${e.check?.passed?'ok':'no'}">${e.check?.passed?'Checks passed':'Checks failed'}</span></p>`+(e.check?.failures?.length?`<p>${esc(e.check.failures.join('\n'))}</p>`:'')}
if(e.kind==='question')return `<p>${esc(e.question)}</p><p><b>User:</b> ${esc(e.answer)}</p>`;if(e.kind==='episode_error')return `<p>${esc(e.error_type)}</p>`;if(e.kind==='memory_update')return '<p class="caption">Select to inspect the profile change.</p>';return ''}
function selectedSubmission(){const submissions=visible().filter(e=>e.episode===state.selected&&e.kind==='submission'),chosen=submissions.find(e=>e._index===state.event);if(chosen)return chosen;const event=state.events[state.event];if(event?.kind==='memory_update')return submissions.filter(e=>e._index<event._index).at(-1);return submissions.at(-1)}
function profilePair(submission){const shown=visible(),start=shown.find(e=>e.episode===state.selected&&e.kind==='task_start');let before=start?.memory??{},after=before;
if(!submission)return {before,after,changed:false};for(const event of shown){if(event.episode===state.selected&&event.kind==='memory_update'&&event._index<submission._index)before=event.after??before}
after=before;const next=shown.find(e=>e.episode===state.selected&&e.kind==='submission'&&e._index>submission._index),update=shown.find(e=>e.episode===state.selected&&e.kind==='memory_update'&&e._index>submission._index&&(!next||e._index<next._index)&&(!e.evidence_id||e.evidence_id===`e${submission.episode}-v${submission.version}`));if(update)after=update.after??before;return {before,after,changed:!!update}}
function renderDetail(){const panel=$('detail'),scroll=$('content')?.scrollTop||0,submission=selectedSubmission(),chosen=visible().find(e=>e._index===state.event);if(!submission){const updates=visible().filter(e=>e.episode===state.selected&&e.kind==='memory_update'),update=chosen?.kind==='memory_update'?chosen:updates.at(-1);panel.innerHTML=empty('No artifact submitted yet',update?'Profile learned from the conversation so far.':'The task’s starting profile will be shown here until a worker output arrives.')+`<div id="content">${update&&state.tab==='profile-diff'?diff(jsonText(update.before),jsonText(update.after)):profileView(update?.after??profilePair(null).before)}</div>`;return}
const versions=visible().filter(e=>e.episode===state.selected&&e.kind==='submission'),index=versions.indexOf(submission);if(state.base!=='previous'&&state.base!=='empty'&&!versions.some(e=>String(e.version)===state.base&&e!==submission))state.base='previous';let base=state.base==='previous'?versions[index-1]:versions.find(e=>String(e.version)===state.base);if(base===submission)base=null;
const files=submission.artifact_files||[{name:'artifact.txt',text:submission.artifact_text||''}],baseFiles=base?.artifact_files||[],names=[...new Set([...files.map(f=>f.name),...baseFiles.map(f=>f.name)])];if(!names.includes(state.file))state.file=names[0]||'';
const pair=chosen?.kind==='memory_update'?{before:chosen.before,after:chosen.after,changed:true}:profilePair(submission),tabs=[['output','Output'],['diff','Output diff'],['profile','Profile'],['profile-diff','Profile diff']];
panel.innerHTML=`<h3>Iteration inspector · v${esc(submission.version)}</h3><div class="inspector-controls"><label for="version">Version</label><select id="version">${versions.map(e=>`<option value="${e._index}" ${e===submission?'selected':''}>v${esc(e.version)} · ${elapsed(e)}</option>`).join('')}</select><label for="baseline">Compare</label><select id="baseline"><option value="previous">Previous version</option><option value="empty">Empty baseline</option>${versions.filter(e=>e!==submission).map(e=>`<option value="${esc(e.version)}">v${esc(e.version)}</option>`).join('')}</select></div><div class="tabs" role="tablist">${tabs.map(([id,title])=>`<button role="tab" aria-selected="${state.tab===id}" data-tab="${id}">${title}</button>`).join('')}</div><div class="inspector-controls" ${state.tab.startsWith('profile')?'hidden':''}><label for="file">File</label><select id="file">${names.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('')}</select></div><p class="caption" id="detail-caption"></p><div id="content"></div>`;
$('baseline').value=state.base;$('file').value=state.file;const file=files.find(f=>f.name===state.file),old=baseFiles.find(f=>f.name===state.file),content=$('content');
if(state.tab==='profile'){content.innerHTML=profileView(pair.after);$('detail-caption').textContent=pair.changed?'Profile after feedback for this version.':'Profile available to this version; no subsequent update is visible.'}
else if(state.tab==='profile-diff'){const comparison=state.base==='previous'?pair.before:state.base==='empty'?{}:profilePair(base).after;content.innerHTML=diff(jsonText(comparison),jsonText(pair.after));$('detail-caption').textContent=state.base==='previous'?'Profile before → after feedback for this version.':`Selected baseline profile → profile after v${submission.version}.`}
else if(state.tab==='diff'){content.innerHTML=diff(old?.text||'',file?.text||'');$('detail-caption').textContent=`${base?`v${base.version}`:'Empty baseline'} → v${submission.version}${file?.truncated||old?.truncated?' · file preview truncated':''}`}
else{content.innerHTML=file?`<pre>${esc(file.text)}</pre>`:empty('File removed in this version');$('detail-caption').textContent=file?.truncated?'File preview truncated at 48,000 characters.':'Worker output as recorded.';if(file&&/\.html?$/i.test(file.name)){content.innerHTML=`<details><summary>Isolated HTML preview (scripts and network disabled)</summary><iframe class="preview" title="Worker HTML preview" sandbox="" referrerpolicy="no-referrer"></iframe></details>`+content.innerHTML;content.querySelector('iframe').srcdoc='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:; font-src data:; form-action \'none\'; base-uri \'none\'">'+file.text}}
content.scrollTop=scroll;$('version').onchange=()=>{state.event=Number($('version').value);state.follow=false;render()};$('baseline').onchange=()=>{state.base=$('baseline').value;renderDetail()};$('file').onchange=()=>{state.file=$('file').value;renderDetail()};}
function jsonText(value){return typeof value==='string'?value:JSON.stringify(value,null,2)}
function profileView(value,depth=0){if(value==null||value===''||(typeof value==='object'&&!Object.keys(value).length))return empty('No learned preferences recorded');if(depth>8)return `<pre>${esc(jsonText(value))}</pre>`;if(typeof value!=='object')return `<div class="profile-card"><p>${esc(value)}</p></div>`;
if(Array.isArray(value))return value.map((item,index)=>`<div class="profile-card"><h4>${esc(item?.name||item?.preference||`Item ${index+1}`)}</h4>${typeof item==='object'&&item?profileFields(item,depth+1):`<p>${esc(item)}</p>`}</div>`).join('');return profileFields(value,depth)}
function profileFields(value,depth){return Object.entries(value).map(([key,item])=>{if(key==='confidence'&&typeof item==='number'&&item>=0&&item<=1)return `<div class="profile-card"><h4>Confidence</h4><span class="confidence"><meter min="0" max="1" value="${item}"></meter>${Math.round(item*100)}%</span></div>`;let contents;if(Array.isArray(item)&&item.every(x=>typeof x!=='object'))contents=item.length?`<ul>${item.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">None recorded</p>';else if(item&&typeof item==='object')contents=profileView(item,depth+1);else contents=`<p>${esc(item??'Not recorded')}</p>`;return `<div class="profile-card"><h4>${esc(words(key))}</h4>${contents}</div>`}).join('')}
// LCS aligns inserted/deleted lines rather than comparing only their positions.
function diff(a,b){if(a===b)return '<p class="diff-meta">No changes.</p><pre>'+esc(b)+'</pre>';const aa=a?a.split('\n'):[],bb=b?b.split('\n'):[];let lines=[],added=0,removed=0;const emit=(kind,text)=>{if(kind==='+')added++;if(kind==='-')removed++;lines.push(`<span class="diff-line ${kind==='+'?'add':kind==='-'?'del':''}">${esc(kind+' '+text)}</span>`)};
if(aa.length*bb.length>1500000){aa.forEach(line=>emit('-',line));bb.forEach(line=>emit('+',line));return `<p class="diff-meta">Large comparison: showing full before/after (${removed} removed, ${added} added lines).</p><pre>${lines.join('')}</pre>`}
const rows=Array.from({length:aa.length+1},()=>new Uint32Array(bb.length+1));for(let i=aa.length-1;i>=0;i--)for(let j=bb.length-1;j>=0;j--)rows[i][j]=aa[i]===bb[j]?rows[i+1][j+1]+1:Math.max(rows[i+1][j],rows[i][j+1]);let i=0,j=0;while(i<aa.length||j<bb.length){if(i<aa.length&&j<bb.length&&aa[i]===bb[j]){emit(' ',aa[i]);i++;j++}else if(j<bb.length&&(i===aa.length||rows[i][j+1]>rows[i+1][j]))emit('+',bb[j++]);else emit('-',aa[i++])}return `<p class="diff-meta"><span class="ok">+${added} added</span> · <span class="no">−${removed} removed</span></p><pre>${lines.join('')}</pre>`}
function stop(){clearInterval(timer);timer=null;state.playing=false}
function advance(){if(state.cursor<state.events.length){state.cursor++;const event=state.events[state.cursor-1];if(event.episode!=null&&event.episode!==state.selected){state.selected=event.episode;state.event=null}if(event.kind==='submission'||event.kind==='memory_update')state.event=event._index}if(state.cursor>=state.events.length)stop();render()}
function start(){stop();state.live=false;if(state.cursor>=state.events.length){state.cursor=0;state.selected=null;state.event=null}state.playing=true;timer=setInterval(advance,Number($('speed').value));render()}
$('runs').onchange=chooseRun;$('filter').oninput=render;$('live').onclick=()=>{stop();state.live=true;state.follow=true;state.cursor=state.events.length;state.selected=episodes(visible()).at(-1)?.start.episode??null;state.event=null;render()};$('replay').onclick=()=>{state.cursor=0;state.selected=null;state.event=null;start()};$('play').onclick=()=>{if(state.playing){stop();render()}else start()};$('step').onclick=()=>{stop();state.live=false;advance()};$('speed').onchange=()=>{if(state.playing){stop();state.playing=true;timer=setInterval(advance,Number($('speed').value))}};$('position').oninput=()=>{stop();state.live=false;state.cursor=Number($('position').value);state.event=null;const event=visible().findLast(e=>e.episode!=null);state.selected=event?.episode??null;render()};
$('episodes').onclick=event=>{const button=event.target.closest('[data-episode]');if(button){state.selected=Number(button.dataset.episode);state.follow=false;state.event=null;state.base='previous';state.file='';$('timeline').scrollTop=0;render()}};
function inspect(event){const target=event.target.closest('[data-event]');if(target){state.event=Number(target.dataset.event);state.follow=false;if(state.events[state.event].kind==='memory_update')state.tab='profile-diff';render()}}
$('timeline').onclick=inspect;$('timeline').onkeydown=event=>{if(event.key==='Enter'||event.key===' '){if(event.target.matches('[data-event]')){event.preventDefault();inspect(event)}}};$('detail').onclick=event=>{const button=event.target.closest('[data-tab]');if(button){state.tab=button.dataset.tab;renderDetail()}};
render();refreshRuns();setInterval(refresh,2000);setInterval(refreshRuns,10000);
</script></body></html>
