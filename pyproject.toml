[project]
name = "preference-experiments"
version = "0.2.0"
description = "Pluggable experiments in agent preference learning through artifact feedback"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]
render = ["playwright>=1.50,<2"]
all = ["mcp>=1.20,<2", "playwright>=1.50,<2"]

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
